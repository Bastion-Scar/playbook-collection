---
- name: Configure MDB for WordPress
  hosts: db_servers
  become: true

  vars_files:
    - vars/variables.yml

  tasks:
    
    - name: Configure MariaDB bind-address
      lineinfile:
        path: /etc/mysql/mariadb.conf.d/50-server.cnf
        regexp: '^bind-address'
        line: 'bind-address = 0.0.0.0'
      notify: Restart MariaDB

    - name: Create WordPress database
      community.mysql.mysql_db:
        name: "{{ wp_db_name }}"
        state: present
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Create WordPress DB user for remote host
      community.mysql.mysql_user:
        name: "{{ wp_db_user }}"
        host: "{{ wp_allowed_host }}"
        password: "{{ wp_db_password }}"
        priv: "{{ wp_db_name }}.*:ALL"
        state: present
        login_unix_socket: /run/mysqld/mysqld.sock

  handlers:
    - name: Restart MariaDB
      service:
        name: mariadb
        state: restarted        