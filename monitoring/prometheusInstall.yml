- name: Configure Prometheus
  hosts: monitoring
  become: true

  vars_files:
    - ../vars/variables.yml

  tasks:

    - name: Create prometheus user
      user:
        name: prometheus
        system: yes
        shell: /sbin/nologin
        create_home: no

    - name: Create directories
      file:
        path: "{{ item }}"
        state: directory
        owner: prometheus
        group: prometheus
        mode: '0755'
      loop:
        - /etc/prometheus
        - /etc/prometheus/rules
        - /var/lib/prometheus
        - /opt/prometheus

    - name: Download prometheus
      get_url:
        url: https://github.com/prometheus/prometheus/releases/download/v2.55.0/prometheus-2.55.0.linux-amd64.tar.gz
        dest: /tmp/prometheus.tar.gz

    - name: Extract prometheus
      unarchive:
        src: /tmp/prometheus.tar.gz
        dest: /opt/
        remote_src: yes
        creates: /opt/prometheus-2.55.0.linux-amd64

    - name: Install binaries
      copy:
        src: "{{ item }}"
        dest: /usr/local/bin/
        mode: '0755'
        remote_src: yes
      loop:
        - /opt/prometheus-2.55.0.linux-amd64/prometheus
        - /opt/prometheus-2.55.0.linux-amd64/promtool

    - name: Copy prometheus config
      template:
        src: ../files/prometheus.yml.j2
        dest: /etc/prometheus/prometheus.yml
        owner: prometheus
        group: prometheus
        mode: '0644'
      notify: Restart Prometheus

    - name: Copy prometheus recording rules
      template:
        src: ../files/mysql_rules.yml.j2
        dest: /etc/prometheus/rules/mysql_rules.yml
        owner: prometheus
        group: prometheus
        mode: '0644'
      notify: Restart Prometheus

    - name: Create Prometheus systemd service
      copy:
        dest: /etc/systemd/system/prometheus.service
        content: |
          [Unit]
          Description=Prometheus
          After=network.target

          [Service]
          User=prometheus
          WorkingDirectory=/var/lib/prometheus
          ExecStart=/usr/local/bin/prometheus \
            --config.file=/etc/prometheus/prometheus.yml \
            --storage.tsdb.path=/var/lib/prometheus

          [Install]
          WantedBy=multi-user.target
      notify: 
        - Reload systemd
        - Restart Prometheus

    - name: Enable and start Prometheus
      systemd:
        name: prometheus
        enabled: yes
        state: started

  handlers:

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Restart Prometheus
      systemd:
        name: prometheus
        state: restarted