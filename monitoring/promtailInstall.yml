- name: Configure Promtail
  hosts: monitoring
  become: true

  vars_files:
    - ../vars/variables.yml

  vars:
    promtail_version: "2.9.4"

  tasks:

    - name: Create promtail user
      user:
        name: promtail
        system: yes
        shell: /sbin/nologin
        create_home: no
        groups: adm,systemd-journal
        append: yes

    - name: Create directories
      file:
        path: "{{ item }}"
        state: directory
        owner: promtail
        group: promtail
        mode: '0755'
      loop:
        - /etc/promtail
        - /var/lib/promtail
        - /opt/promtail

    - name: Download promtail binary
      get_url:
        url: "https://github.com/grafana/loki/releases/download/v{{ promtail_version }}/promtail-linux-amd64.zip"
        dest: /tmp/promtail.zip
        mode: '0644'

    - name: Unzip promtail
      unarchive:
        src: /tmp/promtail.zip
        dest: /opt/
        remote_src: yes
        creates: /opt/promtail-linux-amd64

    - name: Move binary to /usr/local/bin
      copy:
        src: /opt/promtail-linux-amd64
        dest: /usr/local/bin/promtail
        mode: '0755'
        remote_src: yes

    - name: Create promtail config
      copy:
        dest: /etc/promtail/promtail.yml
        owner: promtail
        group: promtail
        mode: '0644'
        content: |
          server:
            http_listen_port: 9080
            grpc_listen_port: 0

          positions:
            filename: /var/lib/promtail/positions.yaml

          clients:
            - url: http://{{ loki_server }}:3100/loki/api/v1/push

          scrape_configs:
            - job_name: system
              journal:
                max_age: 12h
                labels:
                  job: systemd
              relabel_configs:
                - source_labels: ['__journal__systemd_unit']
                  target_label: unit
                - source_labels: ['__journal__hostname']
                  target_label: host

      notify: Restart Promtail

    - name: Create systemd service
      copy:
        dest: /etc/systemd/system/promtail.service
        content: |
          [Unit]
          Description=Promtail
          After=network.target

          [Service]
          User=promtail
          ExecStart=/usr/local/bin/promtail -config.file=/etc/promtail/promtail.yml
          Restart=always

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Restart Promtail

    - name: Enable and start Promtail
      systemd:
        name: promtail
        enabled: yes
        state: started

  handlers:

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Restart Promtail
      systemd:
        name: promtail
        state: restarted