---
- name: Install WordPress on VM
  hosts: wordpress
  become: true

  vars_files:
    - vars/variables.yml

  tasks:


    - name: Remove cdrom from sources.list
      lineinfile:
        path: /etc/apt/sources.list
        regexp: '^deb cdrom:'
        state: absent

    - name: Add proper repositories
      copy:
        content: |
          deb http://deb.debian.org/debian trixie main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian trixie-updates main contrib non-free non-free-firmware
        dest: /etc/apt/sources.list  


        
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install required packages
      apt:
        name:
          - nginx
          - php-fpm
          - php-mysql
          - php-curl
          - php-gd
          - php-mbstring
          - php-xml
          - php-xmlrpc
          - php-soap
          - php-intl
          - php-zip
          - unzip
          - curl
        state: present

    - name: Create web root directory
      file:
        path: "{{ wp_site_dir }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Download WordPress
      get_url:
        url: https://wordpress.org/latest.tar.gz
        dest: /tmp/wordpress.tar.gz

    - name: Extract WordPress
      unarchive:
        src: /tmp/wordpress.tar.gz
        dest: /tmp/
        remote_src: yes

    - name: Copy WordPress files
      copy:
        remote_src: yes
        src: /tmp/wordpress/
        dest: "{{ wp_site_dir }}/"
        owner: www-data
        group: www-data

    - name: Set ownership for WordPress directory
      file:
        path: "{{ wp_site_dir }}"
        owner: www-data
        group: www-data
        recurse: yes

    - name: Detect PHP-FPM socket
      shell: "ls /run/php/ | grep php.*fpm.sock | head -n1"
      register: php_fpm_sock
      changed_when: false

    - name: Create wp-config.php
      copy:
        dest: "{{ wp_site_dir }}/wp-config.php"
        owner: www-data
        group: www-data
        mode: '0640'
        content: |
          <?php
          define('DB_NAME', '{{ wp_db_name }}');
          define('DB_USER', '{{ wp_db_user }}');
          define('DB_PASSWORD', '{{ wp_db_password }}');
          define('DB_HOST', '{{ wp_db_host }}');
          define('DB_CHARSET', 'utf8');
          define('DB_COLLATE', '');
          $table_prefix = 'wp_';
          define('WP_DEBUG', false);
          if ( !defined('ABSPATH') )
              define('ABSPATH', __DIR__ . '/');
          require_once ABSPATH . 'wp-settings.php';

    - name: Configure Nginx site
      copy:
        dest: /etc/nginx/sites-available/wordpress
        content: |
          server {
              listen 8081;
              server_name {{ wp_domain }};
              root {{ wp_site_dir }};
              index index.php index.html index.htm;

              location / {
                  try_files $uri $uri/ /index.php?$args;
              }

              location ~ \.php$ {
                  include snippets/fastcgi-php.conf;
                  fastcgi_pass unix:/run/php/{{ php_fpm_sock.stdout }};
              }

              location ~ /\.ht {
                  deny all;
              }
          }

    - name: Enable Nginx site
      file:
        src: /etc/nginx/sites-available/wordpress
        dest: /etc/nginx/sites-enabled/wordpress
        state: link

    - name: Remove default Nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Start and enable PHP-FPM
      shell: "systemctl enable --now $(systemctl list-unit-files | awk '/php.*-fpm.service/ {print $1}' | head -n1)"
      args:
        executable: /bin/bash

    - name: Start and enable nginx
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Check nginx config
      command: nginx -t
      changed_when: false

    - name: Reload Nginx
      service:
        name: nginx
        state: reloaded